<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Склад — Telegram Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-secondary-bg-color, #eef1f5);
    --surface: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1e293b);
    --hint: var(--tg-theme-hint-color, #64748b);
    --accent: var(--tg-theme-button-color, #2563eb);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --border: rgba(128, 128, 128, 0.25);
    --cell-empty: var(--tg-theme-bg-color, #ffffff);
    --cell-filled: rgba(16, 185, 129, 0.16);
    --cell-match: rgba(245, 158, 11, 0.35);
    --rack-bg: rgba(128, 128, 128, 0.08);
    --rack-back: rgba(128, 128, 128, 0.22);
    --danger: #ef4444;
    --success: #10b981;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    user-select: none;
  }

  /* Верхняя панель */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 54px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 10px;
    z-index: 100;
  }

  .search-wrap {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
  }

  .search-wrap input {
    width: 100%;
    height: 36px;
    padding: 0 28px 0 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    outline: none;
  }

  .search-clear {
    position: absolute;
    right: 6px;
    background: none;
    border: none;
    color: var(--hint);
    font-size: 16px;
    cursor: pointer;
    display: none;
    padding: 2px 4px;
  }

  .btn {
    height: 36px;
    padding: 0 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    white-space: nowrap;
  }

  .btn:active { opacity: 0.75; }
  .btn-primary {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }
  .btn-active {
    background: #f59e0b;
    color: #fff;
    border-color: #d97706;
  }
  .btn-icon { width: 36px; padding: 0; font-size: 16px; }

  /* Холст карты */
  .viewport {
    position: fixed;
    top: 54px; left: 0; right: 0; bottom: 0;
    overflow: hidden;
    touch-action: none;
    background-image: radial-gradient(rgba(128,128,128,0.22) 1px, transparent 1px);
    background-size: 20px 20px;
  }

  .canvas {
    position: absolute;
    top: 0; left: 0;
    width: 1600px;
    height: 1100px;
    transform-origin: 0 0;
  }

  /* Метки проходов */
  .aisle-label {
    position: absolute;
    font-size: 12px;
    font-weight: 700;
    color: var(--hint);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    pointer-events: none;
  }

  /* Стеллаж */
  .rack {
    position: absolute;
    background: var(--rack-bg);
    border: 2px solid var(--border);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 3px 10px rgba(0,0,0,0.06);
  }

  .rack.layout-mode {
    border-style: dashed;
    border-color: #f59e0b;
    cursor: grab;
  }

  .rack-back {
    background: var(--rack-back);
    padding: 4px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    font-size: 11px;
    font-weight: 700;
    color: var(--text);
  }

  .rack.face-down .rack-back {
    order: 1;
    border-radius: 8px 8px 0 0;
    border-bottom: 1px solid var(--border);
  }
  .rack.face-down .rack-cells {
    order: 2;
  }

  .rack.face-up .rack-cells {
    order: 1;
  }
  .rack.face-up .rack-back {
    order: 2;
    border-radius: 0 0 8px 8px;
    border-top: 1px solid var(--border);
  }

  .rack-tools {
    display: none;
    gap: 4px;
  }
  .rack.layout-mode .rack-tools {
    display: flex;
  }

  .mini-btn {
    border: none;
    background: var(--surface);
    color: var(--text);
    border-radius: 5px;
    padding: 2px 6px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }

  .rack-cells {
    display: flex;
    gap: 4px;
    padding: 5px;
  }

  /* Секция стеллажа */
  .cell {
    width: 66px;
    height: 76px;
    background: var(--cell-empty);
    border: 1.5px solid var(--border);
    border-radius: 7px;
    padding: 4px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    cursor: pointer;
    overflow: hidden;
  }

  .rack.face-down .cell {
    border-bottom: 3.5px solid var(--accent);
  }
  .rack.face-up .cell {
    border-top: 3.5px solid var(--accent);
  }

  .cell.filled {
    background: var(--cell-filled);
  }
  .rack.face-down .cell.filled {
    border-bottom-color: var(--success);
  }
  .rack.face-up .cell.filled {
    border-top-color: var(--success);
  }

  .cell.match {
    background: var(--cell-match) !important;
    border-color: #f59e0b !important;
  }

  .cell-num {
    position: absolute;
    top: 2px;
    right: 4px;
    font-size: 9px;
    color: var(--hint);
    font-weight: 600;
  }

  .cell-single {
    font-size: 11px;
    font-weight: 700;
    text-align: center;
    line-height: 1.15;
    word-break: break-word;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .cell-dual {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
    padding-top: 8px;
  }

  .cell-slot {
    font-size: 10px;
    font-weight: 600;
    line-height: 1.1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cell-divider {
    height: 1px;
    background: var(--border);
    margin: 2px 0;
  }

  /* Плавающие кнопки масштаба */
  .zoom-controls {
    position: fixed;
    right: 12px;
    bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 90;
  }

  .zoom-btn {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 18px;
    font-weight: 700;
    box-shadow: 0 3px 10px rgba(0,0,0,0.12);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .zoom-btn.text-sm { font-size: 11px; }

  /* Нижняя шторка (Bottom Sheet) */
  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    z-index: 200;
    display: none;
  }
  .backdrop.open { display: block; }

  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--surface);
    border-radius: 18px 18px 0 0;
    padding: 14px 16px 24px;
    z-index: 210;
    transform: translateY(105%);
    transition: transform 0.22s ease-out;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.18);
  }
  .sheet.open { transform: translateY(0); }

  .sheet-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .sheet-title {
    font-size: 16px;
    font-weight: 700;
  }
  .close-btn {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: none;
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
  }

  .slot-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 10px;
  }

  .slot-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--hint);
    margin-bottom: 8px;
  }

  .field-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }

  .input {
    width: 100%;
    height: 38px;
    padding: 0 10px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    outline: none;
  }

  .qty-box {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .qty-btn {
    width: 34px; height: 38px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  .qty-input {
    width: 48px;
    text-align: center;
    padding: 0 4px;
  }

  .slot-actions {
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }

  .btn-danger {
    background: rgba(239, 68, 68, 0.12);
    color: var(--danger);
    border-color: rgba(239, 68, 68, 0.3);
  }

  /* Меню экспорта/импорта */
  .menu-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .menu-item {
    width: 100%;
    height: 44px;
    justify-content: flex-start;
    padding: 0 14px;
    font-size: 14px;
  }

  .cloud-badge {
    font-size: 11px;
    color: var(--success);
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Поиск товара...">
    <button class="search-clear" id="searchClear">✕</button>
  </div>
  <button class="btn" id="layoutBtn">📐</button>
  <button class="btn btn-icon" id="menuBtn">☰</button>
</div>

<div class="viewport" id="viewport">
  <div class="canvas" id="canvas"></div>
</div>

<div class="zoom-controls">
  <button class="zoom-btn" id="zoomIn">+</button>
  <button class="zoom-btn" id="zoomOut">−</button>
  <button class="zoom-btn text-sm" id="zoomFit">Вся</button>
</div>

<div class="backdrop" id="backdrop"></div>

<!-- Шторка редактирования секции -->
<div class="sheet" id="cellSheet">
  <div class="sheet-header">
    <div>
      <div class="sheet-title" id="sheetTitle">Секция</div>
      <div class="cloud-badge" id="syncStatus">Сохранено</div>
    </div>
    <button class="close-btn" id="closeCellSheet">✕</button>
  </div>

  <!-- Слот ВЕРХ -->
  <div class="slot-card">
    <div class="slot-header">
      <span>⬆️ ВЕРХ</span>
      <button class="mini-btn" id="swapBtn" title="Поменять местами">⇅ Поменять</button>
    </div>
    <div class="field-row">
      <input type="text" class="input" id="topName" placeholder="Название товара">
      <div class="qty-box">
        <button class="qty-btn" data-target="topQty" data-delta="-1">−</button>
        <input type="number" class="input qty-input" id="topQty" value="1" min="1">
        <button class="qty-btn" data-target="topQty" data-delta="1">+</button>
      </div>
    </div>
    <div class="field-row">
      <input type="text" class="input" id="topNote" placeholder="Заметка (необязательно)">
    </div>
    <div class="slot-actions">
      <button class="btn btn-danger" id="clearTop">Очистить верх</button>
      <button class="btn btn-primary" id="saveTop">Сохранить верх</button>
    </div>
  </div>

  <!-- Слот НИЗ -->
  <div class="slot-card">
    <div class="slot-header">
      <span>⬇️ НИЗ</span>
    </div>
    <div class="field-row">
      <input type="text" class="input" id="botName" placeholder="Название товара">
      <div class="qty-box">
        <button class="qty-btn" data-target="botQty" data-delta="-1">−</button>
        <input type="number" class="input qty-input" id="botQty" value="1" min="1">
        <button class="qty-btn" data-target="botQty" data-delta="1">+</button>
      </div>
    </div>
    <div class="field-row">
      <input type="text" class="input" id="botNote" placeholder="Заметка (необязательно)">
    </div>
    <div class="slot-actions">
      <button class="btn btn-danger" id="clearBot">Очистить низ</button>
      <button class="btn btn-primary" id="saveBot">Сохранить низ</button>
    </div>
  </div>
</div>

<!-- Шторка меню -->
<div class="sheet" id="menuSheet">
  <div class="sheet-header">
    <div class="sheet-title">Управление складом</div>
    <button class="close-btn" id="closeMenuSheet">✕</button>
  </div>
  <div class="menu-list">
    <button class="btn menu-item" id="addRackBtn">➕ Добавить новый стеллаж</button>
    <button class="btn menu-item" id="exportBtn">💾 Скачать резервную копию (.json)</button>
    <button class="btn menu-item" id="importBtn">📂 Загрузить из файла (.json)</button>
    <button class="btn menu-item btn-danger" id="resetBtn">🔄 Сбросить схему по умолчанию</button>
  </div>
  <input type="file" id="fileInput" accept=".json" style="display:none">
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) {
  tg.ready();
  tg.expand();
  if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
}

function haptic(type = 'light') {
  if (tg && tg.HapticFeedback) {
    if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
    else tg.HapticFeedback.impactOccurred(type);
  }
}

const STORAGE_KEY = 'sklad_tg_v1';

function getDefaultData() {
  return {
    racks: [
      // Проход 1 (короткие слева, длинные справа)
      { id: 'r1', name: 'Кор. 1А', x: 30,  y: 40,  cols: 3, face: 'down' },
      { id: 'r2', name: 'Кор. 1Б', x: 30,  y: 195, cols: 3, face: 'up' },
      { id: 'r3', name: 'Длин. 1А', x: 280, y: 40,  cols: 9, face: 'down' },
      { id: 'r4', name: 'Длин. 1Б', x: 280, y: 195, cols: 9, face: 'up' },

      // Проход 2
      { id: 'r5', name: 'Кор. 2А', x: 30,  y: 350, cols: 3, face: 'down' },
      { id: 'r6', name: 'Кор. 2Б', x: 30,  y: 505, cols: 3, face: 'up' },
      { id: 'r7', name: 'Длин. 2А', x: 280, y: 350, cols: 9, face: 'down' },
      { id: 'r8', name: 'Длин. 2Б', x: 280, y: 505, cols: 9, face: 'up' },

      // Проход 3
      { id: 'r9',  name: 'Кор. 3А', x: 30,  y: 660, cols: 3, face: 'down' },
      { id: 'r10', name: 'Кор. 3Б', x: 30,  y: 815, cols: 3, face: 'up' },
      { id: 'r11', name: 'Длин. 3А', x: 280, y: 660, cols: 9, face: 'down' },
      { id: 'r12', name: 'Длин. 3Б', x: 280, y: 815, cols: 9, face: 'up' }
    ],
    cells: {} // key: "rackId:colIndex" -> { top: {name, qty, note} | null, bot: {name, qty, note} | null }
  };
}

let state = getDefaultData();
let layoutMode = false;
let searchQuery = '';
let activeCellKey = null;

// Загрузка данных (Telegram CloudStorage + localStorage)
function loadState(callback) {
  const localRaw = localStorage.getItem(STORAGE_KEY);
  if (localRaw) {
    try { state = JSON.parse(localRaw); } catch (e) {}
  }

  if (tg && tg.CloudStorage) {
    tg.CloudStorage.getItem(STORAGE_KEY, (err, val) => {
      if (!err && val) {
        try {
          state = JSON.parse(val);
          localStorage.setItem(STORAGE_KEY, val);
        } catch (e) {}
      }
      callback();
    });
  } else {
    callback();
  }
}

function saveState() {
  const json = JSON.stringify(state);
  localStorage.setItem(STORAGE_KEY, json);
  const badge = document.getElementById('syncStatus');
  if (tg && tg.CloudStorage && json.length < 4000) {
    badge.textContent = 'Синхронизация с Telegram...';
    tg.CloudStorage.setItem(STORAGE_KEY, json, (err) => {
      badge.textContent = err ? 'Сохранено локально' : '☁️ Сохранено в облаке Telegram';
    });
  } else {
    badge.textContent = 'Сохранено на устройстве';
  }
}

// Масштаб и панорамирование
let scale = 0.6;
let panX = 10;
let panY = 10;

const viewport = document.getElementById('viewport');
const canvas = document.getElementById('canvas');

function applyTransform() {
  canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
}

function fitToScreen() {
  if (!state.racks.length) return;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  state.racks.forEach(r => {
    const w = r.cols * 70 + 14;
    const h = 112;
    minX = Math.min(minX, r.x);
    minY = Math.min(minY, r.y);
    maxX = Math.max(maxX, r.x + w);
    maxY = Math.max(maxY, r.y + h);
  });
  const contentW = maxX - minX + 40;
  const contentH = maxY - minY + 40;
  const vw = viewport.clientWidth;
  const vh = viewport.clientHeight;
  scale = Math.min(vw / contentW, vh / contentH, 1.1);
  scale = Math.max(scale, 0.25);
  panX = (vw - contentW * scale) / 2 - minX * scale + 20 * scale;
  panY = Math.max(12, (vh - contentH * scale) / 2 - minY * scale + 20 * scale);
  applyTransform();
}

// Отрисовка карты
function render() {
  canvas.innerHTML = '';
  const q = searchQuery.trim().toLowerCase();

  state.racks.forEach(rack => {
    const el = document.createElement('div');
    el.className = `rack face-${rack.face} ${layoutMode ? 'layout-mode' : ''}`;
    el.style.left = rack.x + 'px';
    el.style.top = rack.y + 'px';

    const back = document.createElement('div');
    back.className = 'rack-back';

    const title = document.createElement('span');
    title.textContent = rack.name;
    title.onclick = (e) => {
      if (!layoutMode) return;
      e.stopPropagation();
      const newName = prompt('Название ряда:', rack.name);
      if (newName && newName.trim()) {
        rack.name = newName.trim();
        saveState();
        render();
      }
    };
    back.appendChild(title);

    const tools = document.createElement('div');
    tools.className = 'rack-tools';

    const flipBtn = document.createElement('button');
    flipBtn.className = 'mini-btn';
    flipBtn.textContent = '⇅';
    flipBtn.onclick = (e) => {
      e.stopPropagation();
      rack.face = rack.face === 'down' ? 'up' : 'down';
      haptic('light');
      saveState();
      render();
    };

    const delBtn = document.createElement('button');
    delBtn.className = 'mini-btn';
    delBtn.textContent = '✕';
    delBtn.onclick = (e) => {
      e.stopPropagation();
      if (confirm(`Удалить стеллаж «${rack.name}»?`)) {
        state.racks = state.racks.filter(r => r.id !== rack.id);
        saveState();
        render();
      }
    };

    tools.appendChild(flipBtn);
    tools.appendChild(delBtn);
    back.appendChild(tools);
    el.appendChild(back);

    const cellsWrap = document.createElement('div');
    cellsWrap.className = 'rack-cells';

    for (let i = 0; i < rack.cols; i++) {
      const key = `${rack.id}:${i}`;
      const data = state.cells[key] || { top: null, bot: null };
      const hasTop = data.top && data.top.name;
      const hasBot = data.bot && data.bot.name;

      const cell = document.createElement('div');
      cell.className = 'cell';
      if (hasTop || hasBot) cell.classList.add('filled');

      if (q) {
        const tMatch = hasTop && (data.top.name.toLowerCase().includes(q) || (data.top.note || '').toLowerCase().includes(q));
        const bMatch = hasBot && (data.bot.name.toLowerCase().includes(q) || (data.bot.note || '').toLowerCase().includes(q));
        if (tMatch || bMatch) cell.classList.add('match');
      }

      const num = document.createElement('span');
      num.className = 'cell-num';
      num.textContent = i + 1;
      cell.appendChild(num);

      if (hasTop && hasBot) {
        const dual = document.createElement('div');
        dual.className = 'cell-dual';
        dual.innerHTML = `
          <div class="cell-slot">⬆ ${escapeHtml(data.top.name)}</div>
          <div class="cell-divider"></div>
          <div class="cell-slot">⬇ ${escapeHtml(data.bot.name)}</div>
        `;
        cell.appendChild(dual);
      } else if (hasTop || hasBot) {
        const item = hasTop ? data.top : data.bot;
        const single = document.createElement('div');
        single.className = 'cell-single';
        single.textContent = item.name;
        cell.appendChild(single);
      }

      cell.onclick = (e) => {
        if (layoutMode) return;
        e.stopPropagation();
        haptic('light');
        openCellSheet(rack, i);
      };

      cellsWrap.appendChild(cell);
    }

    el.appendChild(cellsWrap);

    // Перетаскивание стеллажа в режиме расстановки
    el.addEventListener('pointerdown', (e) => {
      if (!layoutMode) return;
      if (e.target.tagName === 'BUTTON') return;
      e.stopPropagation();
      el.setPointerCapture(e.pointerId);
      const startX = e.clientX;
      const startY = e.clientY;
      const origX = rack.x;
      const origY = rack.y;

      const onMove = (ev) => {
        const dx = (ev.clientX - startX) / scale;
        const dy = (ev.clientY - startY) / scale;
        rack.x = Math.round((origX + dx) / 10) * 10;
        rack.y = Math.round((origY + dy) / 10) * 10;
        el.style.left = rack.x + 'px';
        el.style.top = rack.y + 'px';
      };

      const onUp = () => {
        el.removeEventListener('pointermove', onMove);
        el.removeEventListener('pointerup', onUp);
        saveState();
      };

      el.addEventListener('pointermove', onMove);
      el.addEventListener('pointerup', onUp);
    });

    canvas.appendChild(el);
  });
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
}

// Панорамирование карты пальцем/мышкой
let isPanning = false;
let panStartX = 0, panStartY = 0;

viewport.addEventListener('pointerdown', (e) => {
  if (e.target !== viewport && e.target !== canvas) return;
  isPanning = true;
  panStartX = e.clientX - panX;
  panStartY = e.clientY - panY;
});

window.addEventListener('pointermove', (e) => {
  if (!isPanning) return;
  panX = e.clientX - panStartX;
  panY = e.clientY - panStartY;
  applyTransform();
});

window.addEventListener('pointerup', () => { isPanning = false; });

// Зум колёсиком и кнопками
viewport.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  scale = Math.min(Math.max(scale * delta, 0.25), 2.2);
  applyTransform();
}, { passive: false });

document.getElementById('zoomIn').onclick = () => {
  scale = Math.min(scale * 1.2, 2.2);
  applyTransform();
};
document.getElementById('zoomOut').onclick = () => {
  scale = Math.max(scale * 0.8, 0.25);
  applyTransform();
};
document.getElementById('zoomFit').onclick = () => {
  haptic('light');
  fitToScreen();
};

// Шторка ячейки
const backdrop = document.getElementById('backdrop');
const cellSheet = document.getElementById('cellSheet');
const menuSheet = document.getElementById('menuSheet');

function openCellSheet(rack, colIdx) {
  activeCellKey = `${rack.id}:${colIdx}`;
  const data = state.cells[activeCellKey] || { top: null, bot: null };

  document.getElementById('sheetTitle').textContent = `${rack.name} — Секция ${colIdx + 1}`;

  document.getElementById('topName').value = data.top ? data.top.name : '';
  document.getElementById('topQty').value = data.top ? data.top.qty : 1;
  document.getElementById('topNote').value = data.top ? (data.top.note || '') : '';

  document.getElementById('botName').value = data.bot ? data.bot.name : '';
  document.getElementById('botQty').value = data.bot ? data.bot.qty : 1;
  document.getElementById('botNote').value = data.bot ? (data.bot.note || '') : '';

  backdrop.classList.add('open');
  cellSheet.classList.add('open');
}

function closeSheets() {
  backdrop.classList.remove('open');
  cellSheet.classList.remove('open');
  menuSheet.classList.remove('open');
  activeCellKey = null;
}

backdrop.onclick = closeSheets;
document.getElementById('closeCellSheet').onclick = closeSheets;
document.getElementById('closeMenuSheet').onclick = closeSheets;

document.querySelectorAll('.qty-btn').forEach(btn => {
  btn.onclick = () => {
    const inp = document.getElementById(btn.dataset.target);
    const val = Math.max(1, (parseInt(inp.value, 10) || 1) + parseInt(btn.dataset.delta, 10));
    inp.value = val;
    haptic('light');
  };
});

function saveSlot(slot) {
  if (!activeCellKey) return;
  const name = document.getElementById(slot + 'Name').value.trim();
  const qty = Math.max(1, parseInt(document.getElementById(slot + 'Qty').value, 10) || 1);
  const note = document.getElementById(slot + 'Note').value.trim();

  if (!state.cells[activeCellKey]) state.cells[activeCellKey] = { top: null, bot: null };
  state.cells[activeCellKey][slot] = name ? { name, qty, note } : null;

  if (!state.cells[activeCellKey].top && !state.cells[activeCellKey].bot) {
    delete state.cells[activeCellKey];
  }

  haptic('success');
  saveState();
  render();
}

document.getElementById('saveTop').onclick = () => saveSlot('top');
document.getElementById('saveBot').onclick = () => saveSlot('bot');

document.getElementById('clearTop').onclick = () => {
  document.getElementById('topName').value = '';
  document.getElementById('topQty').value = 1;
  document.getElementById('topNote').value = '';
  saveSlot('top');
};

document.getElementById('clearBot').onclick = () => {
  document.getElementById('botName').value = '';
  document.getElementById('botQty').value = 1;
  document.getElementById('botNote').value = '';
  saveSlot('bot');
};

document.getElementById('swapBtn').onclick = () => {
  if (!activeCellKey) return;
  const cur = state.cells[activeCellKey] || { top: null, bot: null };
  state.cells[activeCellKey] = { top: cur.bot, bot: cur.top };
  haptic('medium');
  saveState();
  render();
  const [rId, cIdx] = activeCellKey.split(':');
  const rack = state.racks.find(r => r.id === rId);
  if (rack) openCellSheet(rack, parseInt(cIdx, 10));
};

// Поиск
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');

searchInput.oninput = () => {
  searchQuery = searchInput.value;
  searchClear.style.display = searchQuery ? 'block' : 'none';
  render();
};

searchClear.onclick = () => {
  searchInput.value = '';
  searchQuery = '';
  searchClear.style.display = 'none';
  render();
};

// Режим расстановки
const layoutBtn = document.getElementById('layoutBtn');
layoutBtn.onclick = () => {
  layoutMode = !layoutMode;
  layoutBtn.classList.toggle('btn-active', layoutMode);
  haptic('medium');
  render();
};

// Меню
document.getElementById('menuBtn').onclick = () => {
  backdrop.classList.add('open');
  menuSheet.classList.add('open');
};

document.getElementById('addRackBtn').onclick = () => {
  closeSheets();
  const name = prompt('Название стеллажа:', 'Новый ряд');
  if (!name) return;
  const cols = Math.min(20, Math.max(1, parseInt(prompt('Количество секций (1–20):', '3'), 10) || 3));
  state.racks.push({
    id: 'r' + Date.now(),
    name: name.trim(),
    x: 40,
    y: 40,
    cols,
    face: 'down'
  });
  saveState();
  render();
};

document.getElementById('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'sklad_backup.json';
  a.click();
  closeSheets();
};

document.getElementById('importBtn').onclick = () => {
  document.getElementById('fileInput').click();
};

document.getElementById('fileInput').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (parsed && Array.isArray(parsed.racks)) {
        state = parsed;
        saveState();
        render();
        fitToScreen();
        closeSheets();
      }
    } catch (err) {
      alert('Неверный формат файла');
    }
  };
  reader.readAsText(file);
};

document.getElementById('resetBtn').onclick = () => {
  if (confirm('Вернуть исходную схему (3 коротких и 3 длинных прохода)? Все товары будут очищены.')) {
    state = getDefaultData();
    saveState();
    render();
    fitToScreen();
    closeSheets();
  }
};

// Старт
loadState(() => {
  render();
  fitToScreen();
});
</script>
</body>
</html>
